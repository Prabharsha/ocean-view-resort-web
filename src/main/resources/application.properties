# ======================================================
# Ocean View Resort - Application Configuration
# ======================================================
# Server
server.port=${PORT:8080}
server.servlet.context-path=/oceanview
spring.jackson.time-zone=Asia/Colombo

# ??? Database (MySQL) ???
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ocean_view_resort?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ??? JPA / Hibernate ???
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

# ??? Thymeleaf ???
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ??? JWT ???
app.jwt.secret=${JWT_SECRET:OceanViewResort256BitSecretKeyForJWTTokenGeneration2026}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ??? Mail ???
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:pansiluprabharsha257@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ksjjfhzlumzbhcut}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ??? Logging ???
logging.level.com.oceanview=DEBUG
logging.level.org.springframework.security=INFO
logging.file.name=logs/oceanview.log

# ??? Actuator ???
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ??? OpenAPI / Swagger ???
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

