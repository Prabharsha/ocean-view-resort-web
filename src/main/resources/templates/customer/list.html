<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Customers')}">
    <title>Customers – Ocean View Resort</title>
</head>
<body>

<nav th:replace="~{fragments/layout :: sidebar}"></nav>
<div th:replace="~{fragments/layout :: sidebarOverlay}"></div>

<div class="ov-main">
    <header th:replace="~{fragments/layout :: topbar('Customer Management')}"></header>

    <div class="ov-content">

        <!-- ── Toolbar ── -->
        <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
            <div class="d-flex gap-2 flex-grow-1" style="max-width:420px">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fas fa-search text-muted"></i>
                    </span>
                    <input id="searchInput" type="text" class="form-control ov-input border-start-0"
                           placeholder="Search by name, email, phone…"
                           oninput="debounceSearch(this.value)"/>
                </div>
                <button class="btn btn-outline-secondary" onclick="loadCustomers()">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <button class="btn btn-ocean" data-bs-toggle="modal" data-bs-target="#customerModal"
                    onclick="openCreateModal()">
                <i class="fas fa-user-plus me-2"></i>New Customer
            </button>
        </div>

        <!-- ── Stats row ── -->
        <div class="row g-3 mb-3" id="statsRow">
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--ov-primary-light);color:var(--ov-primary)">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="statTotal">—</div>
                        <div class="stat-label">Total Customers</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="stat-icon" style="background:#e8f5e9;color:#2e7d32">
                        <i class="fas fa-star"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="statLoyalty">—</div>
                        <div class="stat-label">Total Loyalty Pts</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Table ── -->
        <div class="ov-card animate-in">
            <div class="card-body-ov p-0">
                <div class="table-responsive">
                    <table class="table ov-table mb-0">
                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th class="text-center">Loyalty Pts</th>
                                <th class="text-center">Status</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody">
                            <tr><td colspan="6" class="text-center py-5">
                                <div class="ov-spinner mx-auto"></div>
                            </td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div><!-- /ov-content -->
</div><!-- /ov-main -->

<!-- ══════════════════ Create / Edit Modal ══════════════════ -->
<div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" style="background:var(--ov-primary);color:#fff">
                <h5 class="modal-title" id="customerModalLabel">
                    <i class="fas fa-user-plus me-2"></i>New Customer
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="customerForm" onsubmit="saveCustomer(event)">
                    <input type="hidden" id="editCustomerId"/>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control ov-input" id="cf_firstName" required
                                   placeholder="e.g. John"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control ov-input" id="cf_lastName" required
                                   placeholder="e.g. Silva"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control ov-input" id="cf_email" required
                                   placeholder="e.g. john@email.com"/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Phone</label>
                            <input type="text" class="form-control ov-input" id="cf_phone"
                                   placeholder="+94771234567"/>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Address</label>
                            <textarea class="form-control ov-input" id="cf_address" rows="2"
                                      placeholder="Residential / postal address"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="customerForm" class="btn btn-ocean" id="saveCustomerBtn">
                    <i class="fas fa-save me-2"></i>Save Customer
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ══════════════════ View / Detail Modal ══════════════════ -->
<div class="modal fade" id="viewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="background:var(--ov-primary);color:#fff">
                <h5 class="modal-title"><i class="fas fa-user me-2"></i>Customer Details</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <!-- Tabs -->
                <ul class="nav nav-tabs px-3 pt-2" id="customerDetailTabs">
                    <li class="nav-item">
                        <button class="nav-link active" id="tab-profile-btn" onclick="switchTab('profile')">
                            <i class="fas fa-user me-1"></i>Profile
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="tab-reservations-btn" onclick="switchTab('reservations')">
                            <i class="fas fa-calendar-alt me-1"></i>Reservation History
                            <span class="badge bg-secondary ms-1" id="resHistoryCount"></span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="tab-loyalty-btn" onclick="switchTab('loyalty')">
                            <i class="fas fa-star me-1"></i>Loyalty
                        </button>
                    </li>
                </ul>
                <!-- Profile Tab -->
                <div id="tab-profile" class="p-3">
                    <div class="text-center mb-3">
                        <div class="mx-auto mb-2" style="width:60px;height:60px;border-radius:50%;background:var(--ov-primary);color:#fff;font-size:1.5rem;display:flex;align-items:center;justify-content:center" id="vm-avatar"></div>
                        <h5 class="mb-0" id="vm-name"></h5>
                        <small class="text-muted" id="vm-username"></small>
                    </div>
                    <table class="table table-sm">
                        <tr><th style="width:40%">Customer ID</th><td><code id="vm-id"></code></td></tr>
                        <tr><th>Email</th><td id="vm-email"></td></tr>
                        <tr><th>Phone</th><td id="vm-phone"></td></tr>
                        <tr><th>Address</th><td id="vm-address"></td></tr>
                        <tr><th>Loyalty Points</th><td><span class="badge bg-warning text-dark" id="vm-pts"></span></td></tr>
                        <tr><th>Status</th><td id="vm-status"></td></tr>
                    </table>
                </div>
                <!-- Reservations Tab -->
                <div id="tab-reservations" class="p-3 d-none">
                    <div id="resHistoryBody">
                        <div class="text-center py-4"><div class="ov-spinner mx-auto"></div><br/><small class="text-muted">Loading reservations…</small></div>
                    </div>
                </div>
                <!-- Loyalty Tab -->
                <div id="tab-loyalty" class="p-3 d-none">
                    <div id="loyaltyBody">
                        <div class="text-center py-4"><div class="ov-spinner mx-auto"></div></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-ocean" id="editFromViewBtn">
                    <i class="fas fa-edit me-2"></i>Edit
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ══════════════════ Deactivate Confirm Modal ══════════════════ -->
<div class="modal fade" id="deactivateModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title"><i class="fas fa-exclamation-triangle me-2"></i>Deactivate</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Deactivate <strong id="deactivateName"></strong>?<br/>
                <small class="text-muted">The account will be hidden but data is preserved.</small></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger btn-sm" id="confirmDeactivateBtn">Deactivate</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
let allCustomers = [];
let searchTimer;

// ── Load ──────────────────────────────────────────────────
async function loadCustomers(q = '') {
    const url = q ? `/api/customers?q=${encodeURIComponent(q)}` : '/api/customers';
    const res = await api(url);
    if (!res?.ok) { showToast('Failed to load customers', 'error'); return; }
    allCustomers = await res.json();
    renderTable(allCustomers);
    updateStats(allCustomers);
}

function debounceSearch(val) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => loadCustomers(val), 350);
}

// ── Render Table ──────────────────────────────────────────
function renderTable(customers) {
    const tbody = document.getElementById('customerTableBody');
    if (!customers.length) {
        tbody.innerHTML = `<tr><td colspan="6">
            <div class="empty-state"><i class="fas fa-users"></i>
            <h5>No customers found</h5>
            <p>Add a new customer to get started.</p></div></td></tr>`;
        return;
    }
    tbody.innerHTML = customers.map(c => `
        <tr>
            <td>
                <div class="d-flex align-items-center gap-2">
                    <div class="user-avatar" style="width:36px;height:36px;font-size:.8rem;border-radius:50%;background:var(--ov-primary);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                        ${(c.firstName?.[0]||'') + (c.lastName?.[0]||'')}
                    </div>
                    <div>
                        <div class="fw-semibold">${c.firstName} ${c.lastName}</div>
                        <div class="text-muted" style="font-size:.78rem">${c.id}</div>
                    </div>
                </div>
            </td>
            <td>${c.email}</td>
            <td>${c.phone || '—'}</td>
            <td class="text-center"><span class="badge bg-warning text-dark">${c.loyaltyPoints}</span></td>
            <td class="text-center"><span class="badge-status ${c.active ? 'badge-confirmed' : 'badge-cancelled'}">${c.active ? 'Active' : 'Inactive'}</span></td>
            <td class="text-center">
                <button class="btn btn-sm btn-outline-primary me-1" title="View" onclick="viewCustomer('${c.id}')">
                    <i class="fas fa-eye"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary me-1" title="Edit" onclick="editCustomer('${c.id}')">
                    <i class="fas fa-edit"></i>
                </button>
                ${c.active ? `<button class="btn btn-sm btn-outline-danger" title="Deactivate" onclick="promptDeactivate('${c.id}','${c.firstName} ${c.lastName}')">
                    <i class="fas fa-user-slash"></i></button>` : ''}
            </td>
        </tr>`).join('');
}

function updateStats(customers) {
    document.getElementById('statTotal').textContent = customers.length;
    document.getElementById('statLoyalty').textContent =
        customers.reduce((s, c) => s + (c.loyaltyPoints || 0), 0).toLocaleString();
}

// ── Create ────────────────────────────────────────────────
function openCreateModal() {
    document.getElementById('customerModalLabel').innerHTML =
        '<i class="fas fa-user-plus me-2"></i>New Customer';
    document.getElementById('customerForm').reset();
    document.getElementById('editCustomerId').value = '';
}

// ── Edit ──────────────────────────────────────────────────
function editCustomer(id) {
    const c = allCustomers.find(x => x.id === id);
    if (!c) return;
    document.getElementById('customerModalLabel').innerHTML =
        '<i class="fas fa-edit me-2"></i>Edit Customer';
    document.getElementById('editCustomerId').value = c.id;
    document.getElementById('cf_firstName').value  = c.firstName || '';
    document.getElementById('cf_lastName').value   = c.lastName  || '';
    document.getElementById('cf_email').value      = c.email     || '';
    document.getElementById('cf_phone').value      = c.phone     || '';
    document.getElementById('cf_address').value    = c.address   || '';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('customerModal')).show();
    bootstrap.Modal.getInstance(document.getElementById('viewModal'))?.hide();
}

// ── Save (create or update) ───────────────────────────────
async function saveCustomer(e) {
    e.preventDefault();
    const btn = document.getElementById('saveCustomerBtn');
    btn.disabled = true;

    const id = document.getElementById('editCustomerId').value;
    const body = {
        firstName: document.getElementById('cf_firstName').value,
        lastName:  document.getElementById('cf_lastName').value,
        email:     document.getElementById('cf_email').value,
        phone:     document.getElementById('cf_phone').value,
        address:   document.getElementById('cf_address').value,
    };

    const isCreate = !id;
    const res = await api(isCreate ? '/api/customers' : `/api/customers/${id}`, {
        method: isCreate ? 'POST' : 'PUT',
        body
    });

    if (res?.ok) {
        showToast(isCreate ? 'Customer created!' : 'Customer updated!', 'success');
        bootstrap.Modal.getInstance(document.getElementById('customerModal'))?.hide();
        await loadCustomers(document.getElementById('searchInput').value);
    } else {
        const err = await res?.json().catch(() => ({}));
        showToast(err.message || 'Failed to save customer', 'error');
    }
    btn.disabled = false;
}

// ── View ──────────────────────────────────────────────────
let currentViewCustomerId = null;

function switchTab(tab) {
    ['profile','reservations','loyalty'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('d-none', t !== tab);
        document.getElementById(`tab-${t}-btn`).classList.toggle('active', t === tab);
    });
}

function viewCustomer(id) {
    const c = allCustomers.find(x => x.id === id);
    if (!c) return;
    currentViewCustomerId = id;

    // Populate profile tab
    const initials = (c.firstName?.[0]||'') + (c.lastName?.[0]||'');
    document.getElementById('vm-avatar').textContent  = initials;
    document.getElementById('vm-name').textContent    = `${c.firstName} ${c.lastName}`;
    document.getElementById('vm-username').textContent= '';
    document.getElementById('vm-id').textContent      = c.id;
    document.getElementById('vm-email').textContent   = c.email;
    document.getElementById('vm-phone').textContent   = c.phone || '—';
    document.getElementById('vm-address').textContent = c.address || '—';
    document.getElementById('vm-pts').textContent     = c.loyaltyPoints;
    document.getElementById('vm-status').innerHTML    = `<span class="badge-status ${c.active ? 'badge-confirmed' : 'badge-cancelled'}">${c.active ? 'Active' : 'Inactive'}</span>`;

    // Reset to profile tab
    switchTab('profile');
    document.getElementById('resHistoryCount').textContent = '';
    document.getElementById('resHistoryBody').innerHTML    =
        '<div class="text-center py-4"><div class="ov-spinner mx-auto"></div><br/><small class="text-muted">Loading…</small></div>';
    document.getElementById('loyaltyBody').innerHTML       =
        '<div class="text-center py-4"><div class="ov-spinner mx-auto"></div></div>';

    document.getElementById('editFromViewBtn').onclick = () => editCustomer(id);
    bootstrap.Modal.getOrCreateInstance(document.getElementById('viewModal')).show();

    // Load reservation history and loyalty in background
    loadCustomerReservations(id);
    loadCustomerLoyalty(id, c.loyaltyPoints);
}

async function loadCustomerReservations(customerId) {
    try {
        const res = await api(`/api/reservations/customer/${customerId}`);
        if (!res?.ok) throw new Error('Failed');
        const reservations = await res.json();
        document.getElementById('resHistoryCount').textContent = reservations.length;

        if (!reservations.length) {
            document.getElementById('resHistoryBody').innerHTML =
                '<div class="text-center py-4 text-muted"><i class="fas fa-calendar-times fa-2x mb-2"></i><br/>No reservations found</div>';
            return;
        }

        document.getElementById('resHistoryBody').innerHTML = `
            <div class="table-responsive">
                <table class="table table-sm ov-table mb-0">
                    <thead><tr>
                        <th>Reservation #</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Status</th><th></th>
                    </tr></thead>
                    <tbody>
                        ${reservations.map(r => `<tr>
                            <td><a href="${CTX}/reservations/view/${r.id}" target="_blank" class="fw-semibold text-primary">${r.reservationNumber || '—'}</a></td>
                            <td>${r.roomNumber || r.roomId || '—'}</td>
                            <td>${r.checkInDate ? new Date(r.checkInDate).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—'}</td>
                            <td>${r.checkOutDate ? new Date(r.checkOutDate).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—'}</td>
                            <td>${statusBadge(r.status)}</td>
                            <td><a href="${CTX}/reservations/view/${r.id}" target="_blank" class="btn btn-xs btn-outline-primary" style="font-size:.75rem;padding:.15rem .4rem"><i class="fas fa-eye"></i></a></td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>`;
    } catch {
        document.getElementById('resHistoryBody').innerHTML =
            '<div class="text-center py-3 text-danger"><i class="fas fa-exclamation-circle me-1"></i>Failed to load reservations</div>';
    }
}

async function loadCustomerLoyalty(customerId, currentPoints) {
    try {
        const [balRes, histRes] = await Promise.all([
            api(`/api/loyalty/balance/${customerId}`),
            api(`/api/loyalty/history/${customerId}`)
        ]);
        const bal  = balRes?.ok  ? await balRes.json()  : null;
        const hist = histRes?.ok ? await histRes.json() : [];

        const tierColor = { BRONZE:'#cd7f32', SILVER:'#aaa', GOLD:'#ffc107', PLATINUM:'#7b68ee' };
        const tierName  = bal?.tier || 'BRONZE';
        const color     = tierColor[tierName] || '#ffc107';

        document.getElementById('loyaltyBody').innerHTML = `
            <div class="d-flex align-items-center gap-3 mb-3 p-3 rounded-3" style="background:#fff8e1;border:1.5px solid #ffe082">
                <div style="width:48px;height:48px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center">
                    <i class="fas fa-crown text-white fa-lg"></i>
                </div>
                <div>
                    <div class="fw-bold" style="font-size:1.1rem">${(bal?.balance ?? currentPoints).toLocaleString()} Points</div>
                    <div class="text-muted small">${bal?.tierDisplayName || tierName} Tier · ${bal?.benefits || ''}</div>
                    ${bal?.nextTier && bal.pointsToNextTier > 0 ? `<div class="text-muted" style="font-size:.78rem">${bal.pointsToNextTier} pts to ${bal.nextTier}</div>` : ''}
                </div>
            </div>
            ${hist.length ? `
            <div class="fw-semibold mb-2"><i class="fas fa-history me-1 text-muted"></i>Recent Transactions</div>
            <div style="max-height:220px;overflow-y:auto">
                <table class="table table-sm mb-0">
                    <thead><tr><th>Date</th><th>Description</th><th class="text-end">Points</th></tr></thead>
                    <tbody>
                        ${hist.slice(0,20).map(t => `<tr>
                            <td style="font-size:.78rem">${t.createdAt ? new Date(t.createdAt).toLocaleDateString('en-GB') : '—'}</td>
                            <td style="font-size:.78rem">${t.description || t.transactionType}</td>
                            <td class="text-end fw-bold ${t.points > 0 ? 'text-success' : 'text-danger'}" style="font-size:.78rem">${t.points > 0 ? '+' : ''}${t.points}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>` : '<div class="text-muted text-center py-3">No loyalty transactions yet</div>'}`;
    } catch {
        document.getElementById('loyaltyBody').innerHTML =
            '<div class="text-center py-3 text-danger">Failed to load loyalty data</div>';
    }
}

// ── Deactivate ────────────────────────────────────────────
function promptDeactivate(id, name) {
    document.getElementById('deactivateName').textContent = name;
    document.getElementById('confirmDeactivateBtn').onclick = async () => {
        const res = await api(`/api/customers/${id}`, { method: 'DELETE' });
        if (res?.ok || res?.status === 204) {
            showToast('Customer deactivated', 'success');
            bootstrap.Modal.getInstance(document.getElementById('deactivateModal'))?.hide();
            await loadCustomers();
        } else {
            showToast('Failed to deactivate', 'error');
        }
    };
    bootstrap.Modal.getOrCreateInstance(document.getElementById('deactivateModal')).show();
}


// ── Init ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => loadCustomers());
</script>
</body>
</html>
