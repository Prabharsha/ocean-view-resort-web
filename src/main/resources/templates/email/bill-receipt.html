<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Payment Receipt</title></head>
<body style="margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;background:#f4f6f8;">
<table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:30px auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <tr><td style="background:linear-gradient(135deg,#0077b6,#00b4d8);padding:30px 40px;text-align:center;">
        <h1 style="color:#fff;margin:0;font-size:24px;">🏨 Ocean View Resort</h1>
        <p style="color:#caf0f8;margin:5px 0 0;font-size:14px;">Payment Receipt</p></td></tr>
    <tr><td style="padding:30px 40px;">
        <p style="font-size:16px;color:#333;">Dear <strong th:text="${guestName}">Guest</strong>,</p>
        <p style="color:#555;">Your payment has been successfully processed.</p>
        <p style="color:#555;">Bill ID: <strong th:text="${billId}">bill-001</strong></p>
        <p style="color:#555;">Total Paid: <strong>LKR <span th:text="${totalAmount}">500.00</span></strong></p>
        <p style="color:#555;">Thank you for your payment. If you have any questions, please contact our reception.</p>
    </td></tr>
    <tr><td style="background:#023e8a;padding:20px 40px;text-align:center;">
        <p style="color:#90e0ef;margin:0;font-size:12px;">&copy; 2026 Ocean View Resort. All rights reserved.</p></td></tr>
</table>
</body>
</html>
