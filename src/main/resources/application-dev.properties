# ═══════════════════════════════════════════════════════
# Ocean View Resort - Development Profile
# ═══════════════════════════════════════════════════════

# ─── Database (MySQL – local dev) ───
spring.datasource.url=jdbc:mysql://localhost:3306/oceanview_resort?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ─── JPA ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── Logging ───
logging.level.com.oceanview=DEBUG
logging.level.org.springframework.web=DEBUG

# ─── Thymeleaf ───
spring.thymeleaf.cache=false
